<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Izmam</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Stone Paper Scissor</h1>
    <div class="choices">
        <div class="choice" id="stone">
            <img src="stone.jpeg" alt="">
        </div>
        <div class="choice" id="paper">
            <img src="paper.jpeg" alt="">
        </div>
        <div class="choice" id="scissor">
            <img src="scissor.jpeg" alt="">
        </div>
    </div>

    <div class="score-board">
        <div class="score">
            <p id="user-score">0</p>
            <p>user</p>
        </div>
        <div class="score">
            <p id="comp-score">0</p>
            <p>comp</p>
        </div>
    </div>

    <div class="msg-container">
        <p id="msg">Play your move</p>
    </div>

    <div id="lstdiv">
        <p id="lstpara">Mohammad Izmam</p>
    </div>
    
</body>
<script src="sps.js"></script>
</html>
